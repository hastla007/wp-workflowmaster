name: PHP

# Syntax, license guard (WF-SPEC-12) and consumer tests (C-1 to C-16) of the free core on every supported PHP version.
on:
  push:
    paths:
      - "**.php"
      - "docs/examples/**"
      - ".github/workflows/php.yml"
  pull_request:
    paths:
      - "**.php"
      - "docs/examples/**"
      - ".github/workflows/php.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring
          coverage: none
      - name: Syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: License guard
        run: php tests/license-guard.php
      - name: Tests
        run: php tests/run.php
