name: PHP

# Syntax, license guard (WF-SPEC-12) and consumer tests (C-1 to C-16) of the free core on every supported PHP version
# (PHP 8.5+, MINVER-1). The code itself stays parseable on PHP 8.3, the version of the local development machine.
on:
  push:
    branches:
      - main
    tags:
      - "*"
    paths:
      - "**.php"
      - "docs/**"
      - "languages/**"
      - ".github/workflows/php.yml"
  # Same paths as push: tests read docs/OPTIONS.md and docs/SDK.md (register and hooks), the POT check languages/.
  pull_request:
    paths:
      - "**.php"
      - "docs/**"
      - "languages/**"
      - ".github/workflows/php.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}${{ matrix.experimental && ' (experimental)' || '' }}
    runs-on: ubuntu-latest
    # Minimum PHP 8.5 (MINVER-1). PHP 8.6 runs as setup-php's nightly build: shown, but may fail without failing the run.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        php: ["8.5"]
        experimental: [false]
        include:
          - php: "8.6"
            experimental: true
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring
          coverage: none
      # Deprecations of newer PHP versions (8.5, 8.6) count as errors: "php -l" only prints them, so the output is checked.
      - name: Syntax
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -d error_reporting=-1 -l > "$RUNNER_TEMP/lint.txt" 2>&1 || { cat "$RUNNER_TEMP/lint.txt"; exit 1; }
          if grep -E '(Deprecated|Warning|Notice):' "$RUNNER_TEMP/lint.txt"; then exit 1; fi
      - name: License guard
        run: php tests/license-guard.php
      - name: Tests
        run: |
          rc=0
          php -d error_reporting=-1 -d display_errors=1 tests/run.php > "$RUNNER_TEMP/tests.txt" 2>&1 || rc=$?
          tail -n 3 "$RUNNER_TEMP/tests.txt"
          if grep -E '(Deprecated|Warning|Notice|Fatal error):' "$RUNNER_TEMP/tests.txt"; then exit 1; fi
          exit $rc
      - name: Translation template up to date
        run: php bin/make-pot.php --check
      - name: German translations (de_DE du, de_DE_formal Sie) complete and compiled
        run: php bin/make-l10n.php --check
