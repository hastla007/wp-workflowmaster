<rect x="276" y="210" width="1124" height="75" rx="10" fill="#fff" stroke="#e2e8f0"/><circle cx="310" cy="247" r="15" fill="#e9f2fb"/><text x="306" y="252" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#3974ae">2</text><text x="340" y="240" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#243850">Wähle, wer optionale Erinnerungen ausführt</text><text x="340" y="261" font-family="Inter,Arial,sans-serif" font-size="11" fill="#718096">Ticketverkauf, Zahlung, Einlass und Erstattung bleiben Pass Captain-eigene Abläufe.</text>
<rect x="276" y="305" width="530" height="210" rx="12" fill="#fff" stroke="#c9d5e2"/><text x="302" y="345" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#243850">Pass Captain</text><rect x="690" y="326" width="88" height="25" rx="12" fill="#e8f6ef"/><text x="706" y="343" font-family="Inter,Arial,sans-serif" font-size="10" fill="#28764e">Aktuell aktiv</text><text x="302" y="382" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53647a">• Teilnehmer-Erinnerung 3 Tage vor Termin</text><text x="302" y="410" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53647a">• Änderungsbenachrichtigung bei Terminverschiebung</text><text x="302" y="438" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53647a">• Native Queue: 8 geplante Nachrichten</text><text x="302" y="478" font-family="Inter,Arial,sans-serif" font-size="11" fill="#7b8797">Besitzer der Kernkommunikation bleibt Pass Captain.</text>
<rect x="836" y="305" width="564" height="210" rx="12" fill="#fff" stroke="#e1c477"/><text x="862" y="345" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#243850">Workflow Captain</text><rect x="1280" y="326" width="92" height="25" rx="12" fill="#fff5dd"/><text x="1292" y="343" font-family="Inter,Arial,sans-serif" font-size="10" fill="#9c7119">Vorschlag</text><text x="862" y="382" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53647a">✓ Zusatznachricht nach Check-in ausführen</text><text x="862" y="410" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53647a">✓ Review-Follow-up planen (Review-Regeln bleiben aktiv)</text><text x="862" y="438" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53647a">✓ Native Erinnerungen bleiben unverändert</text><text x="862" y="478" font-family="Inter,Arial,sans-serif" font-size="11" fill="#7b8797">Keine automatische Umschaltung. Erst nach Betreiberbestätigung.</text>
<rect x="276" y="535" width="1124" height="140" rx="12" fill="#ffffff" stroke="#e2e8f0"/><text x="302" y="574" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#243850">Duplikat- und Auswirkungsprüfung</text><text x="302" y="607" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53647a">8 Native-Aufträge gefunden · 0 doppelte Empfänger · 2 Aktionen benötigen Review-Pro</text><text x="302" y="635" font-family="Inter,Arial,sans-serif" font-size="11" fill="#718096">Vorschau zeigt Besitzerwechsel, Fallback und rückgängig machbare Einstellungen vor dem Speichern.</text>
<rect x="276" y="700" width="1124" height="65" rx="10" fill="#fff7e6" stroke="#edd7a1"/><text x="302" y="728" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#88631c">Wichtig</text><text x="360" y="728" font-family="Inter,Arial,sans-serif" font-size="12" fill="#725b2d">Bei Pro-Ablauf oder Plugin-Ausfall wird nicht still übernommen. Die gewählte Fallbackregel wird protokolliert.</text><text x="360" y="749" font-family="Inter,Arial,sans-serif" font-size="11" fill="#725b2d">Zurück zur nativen Steuerung ist jederzeit über den gleichen Assistenten möglich.</text>
