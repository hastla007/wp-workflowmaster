<text x="276" y="111" font-family="Inter,Arial,sans-serif" font-size="12" fill="#646970">Captain Suite / Workflow Captain / Integrationen / Kundenconnectoren</text>
<text x="276" y="157" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="24" font-weight="600" fill="#1d2327">Kundenconnectoren: BoatingSchool und LearnBoating</text>
<text x="276" y="182" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="13" fill="#50575e">Zwei getrennte Projekte mit unterschiedlichen Systemgrenzen und Connector-Arten.</text>
<rect x="1200" y="136" width="198" height="38" rx="3" fill="#2271b1"/><text x="1240" y="160" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="12" font-weight="600" fill="#ffffff">Connector konfigurieren</text>
<rect x="276" y="204" width="1122" height="48" fill="#ffffff" stroke="#c3c4c7"/><rect x="276" y="204" width="4" height="48" fill="#dba617"/><text x="296" y="225" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="12" font-weight="600" fill="#1d2327">Konzeptstatus: Für beide Kunden ist eine eigene Workflow-Bridge erforderlich.</text><text x="296" y="242" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="10" fill="#50575e">Vorhandene Commerce- und Lernzugangsabläufe bleiben bei den jeweiligen Fachsystemen.</text>
<rect x="276" y="270" width="1122" height="210" fill="#ffffff" stroke="#c3c4c7"/><text x="298" y="300" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="14" font-weight="600" fill="#1d2327">1. BoatingSchool B2B · externe Laravel-App</text><rect x="1192" y="282" width="176" height="26" rx="3" fill="#fff3cd"/><text x="1207" y="299" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="10" font-weight="600" fill="#775d00">WORKFLOW-BRIDGE OFFEN</text>
<text x="298" y="327" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="10" fill="#646970">Bestehender Baustein</text><text x="454" y="327" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="10" font-weight="600" fill="#1d2327">Woo-Connector + Commerce API v1</text><text x="712" y="327" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="10" fill="#646970">HMAC, Timestamp, Nonce, Idempotency pro Order-Position</text>
<text x="298" y="355" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="10" fill="#646970">Geplante Trigger</text><text x="454" y="355" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="10" fill="#1d2327">Shopkonto geprüft/verknüpft · Batch geliefert/entwertet</text><text x="824" y="355" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="10" fill="#646970">nur IDs, Status und Mengen</text>
<text x="298" y="383" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="10" fill="#646970">Geplante Aktionen</text><text x="454" y="383" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="10" fill="#1d2327">Schuladmin benachrichtigen · Tenant-scoped Gruppeneinladung</text><text x="824" y="383" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="10" fill="#646970">neue API-Scope erforderlich</text>
<rect x="298" y="405" width="1074" height="48" fill="#f6f7f7" stroke="#dcdcde"/><text x="314" y="425" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="10" font-weight="600" fill="#1d2327">GESCHÄFTSREGEL</text><text x="454" y="425" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="10" fill="#50575e">Workflow gibt keine B2B-Konten frei, verknüpft keine E-Mails und erzeugt oder widerruft keine Plattformcodes.</text><text x="454" y="442" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="9" fill="#646970">Eigener Workflow-Key; bestehender Commerce-Key bleibt ausschließlich für die Shop-API.</text>
<rect x="276" y="496" width="1122" height="210" fill="#ffffff" stroke="#c3c4c7"/><text x="298" y="526" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="14" font-weight="600" fill="#1d2327">2. LearnBoating B2C · lokales WordPress-Plugin</text><rect x="1192" y="508" width="176" height="26" rx="3" fill="#fff3cd"/><text x="1207" y="525" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="10" font-weight="600" fill="#775d00">PROVIDER-CONTRACT OFFEN</text>
<text x="298" y="553" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="10" fill="#646970">Bestehender Baustein</text><text x="454" y="553" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="10" font-weight="600" fill="#1d2327">Woo OrderSync + VoucherGrants v1 + Gruppenservice</text><text x="824" y="553" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="10" fill="#646970">lokal, idempotent</text>
<text x="298" y="581" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="10" fill="#646970">Geplante Trigger</text><text x="454" y="581" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="10" fill="#1d2327">Zugang geändert · Gruppenmitglied geändert · Prüfungsabschluss</text><text x="824" y="581" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="10" fill="#646970">keine Antworten/PII</text>
<text x="298" y="609" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="10" fill="#646970">Geplante Aktionen</text><text x="454" y="609" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="10" fill="#1d2327">Vorlagenbasierte Nachricht · berechtigte Gruppeneinladung</text><text x="824" y="609" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="10" fill="#646970">Service-API, kein Tabellenzugriff</text>
<rect x="298" y="631" width="1074" height="48" fill="#f6f7f7" stroke="#dcdcde"/><text x="314" y="651" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="10" font-weight="600" fill="#1d2327">GESCHÄFTSREGEL</text><text x="454" y="651" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="10" fill="#50575e">Workflow schreibt keine Woo-Zahlungen, Lernzugänge, VoucherGrants oder Prüfungsergebnisse.</text><text x="454" y="668" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="9" fill="#646970">Für Zugangsfolgen ist learning.entitlement.changed der kanonische Trigger.</text>
<rect x="276" y="722" width="1122" height="46" fill="#ffffff" stroke="#c3c4c7"/><text x="296" y="750" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="10" fill="#50575e">Die Verbindungskarte zeigt zwei Kundenprofile zur Konzeptprüfung; produktiv werden sie auf getrennten WordPress-Installationen eingerichtet.</text>
